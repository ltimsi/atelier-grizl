server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;

    # /freins sans « / » final renvoie vers /freins/ : une redirection relative garde le https du proxy devant le
    # conteneur, au lieu d'écrire http://hôte/freins/.
    absolute_redirect off;

    # Chaque page est un dossier et son index.html : /freins/plaquettes/ sert /freins/plaquettes/index.html. Toutes se
    # revalident à chaque chargement (expires -1 envoie « Cache-Control: no-cache »), pas seulement la racine, pour
    # qu'une page ne garde jamais les adresses d'une version précédente. Même raison qu'en dessous pour expires.
    location ~* \.html$ {
        expires -1;
    }
    # Les modules ES n'ont pas de version dans leur nom : no-cache les fait revalider (ETag) à chaque chargement, pour
    # qu'un déploiement ne mélange jamais deux versions. expires plutôt qu'add_header, qui couperait ici l'héritage
    # des en-têtes de sécurité du bloc server.
    location ~* \.js$ {
        expires -1;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
