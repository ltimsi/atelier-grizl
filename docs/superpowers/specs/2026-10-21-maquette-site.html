<title>Atelier Grizl, nouveau site</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Mise en page : application d'atelier pour l'ordinateur. Menu des catégories fixe à gauche, barre du haut avec fil d'Ariane et recherche, contenu en pleine largeur découpé en blocs courts. Palette et polices reprises du site actuel. */
:root{
  --bg:#EDF0EF; --panel:#F9FAFA; --plate:#E3E8E9; --side:#E4E9E8;
  --ink:#16202A; --ink-2:#465462; --ink-3:#6F7D89;
  --line:#C6CFD4; --line-2:#DAE1E4;
  --acc:#56479A; --acc-2:#E9E5F6; --on-acc:#FFFFFF;
  --hot:#9E4C06; --hot-2:#FAE8D6;
  --ok:#2B724A; --ok-2:#DFF0E5;
  --stop:#AE2A20; --stop-2:#F7E0DC;
  --studio:#EEF0F0;
  --f-disp:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px; --side-w:288px;
  --gut:max(16px, env(safe-area-inset-left,0px));
  --gut-r:max(16px, env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151A; --panel:#161D23; --plate:#19222A; --side:#0C1115;
    --ink:#E3E9ED; --ink-2:#A6B3BD; --ink-3:#7A8893;
    --line:#2D3842; --line-2:#222B33;
    --acc:#B1A5F0; --acc-2:#272242; --on-acc:#16112B;
    --hot:#F2A766; --hot-2:#3A2816;
    --ok:#78CB9E; --ok-2:#16321F;
    --stop:#F48B81; --stop-2:#3E1D1A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151A; --panel:#161D23; --plate:#19222A; --side:#0C1115;
  --ink:#E3E9ED; --ink-2:#A6B3BD; --ink-3:#7A8893;
  --line:#2D3842; --line-2:#222B33;
  --acc:#B1A5F0; --acc-2:#272242; --on-acc:#16112B;
  --hot:#F2A766; --hot-2:#3A2816;
  --ok:#78CB9E; --ok-2:#16321F;
  --stop:#F48B81; --stop-2:#3E1D1A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
a{color:var(--acc);text-underline-offset:2px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0;line-height:1.08}
h1{font-size:clamp(2rem,3.4vw,3rem);font-weight:800;font-stretch:74%;letter-spacing:-.005em}
h2{font-size:1.45rem;font-weight:800;font-stretch:80%}
h3{font-size:1.08rem;font-weight:700;font-stretch:90%}
p{margin:0}
.mono{font-family:var(--f-mono)}
.label{font-family:var(--f-mono);font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}

/* Bandeau de maquette */
.proto{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;background:var(--acc);color:var(--on-acc);font-family:var(--f-mono);font-size:.74rem;padding-block:6px;padding-left:var(--gut);padding-right:var(--gut-r)}
.proto b{font-weight:600}

/* Squelette */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:calc(100% - 30px)}
.side{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;background:var(--side);border-right:1px solid var(--line);padding:22px 14px 28px;display:flex;flex-direction:column;gap:22px}
.brand{padding:0 8px}
.brand .label{color:var(--acc)}
.brand .name{font-family:var(--f-disp);font-weight:800;font-stretch:72%;font-size:1.9rem;line-height:1;margin-top:6px;color:var(--ink)}
.nav-g{display:flex;flex-direction:column;gap:2px}
.nav-g > .label{padding:0 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:.95rem}
.nav a:hover{background:var(--panel)}
.nav a[aria-current="page"]{background:var(--acc);color:var(--on-acc)}
.nav a[aria-current="page"] .cnt{color:var(--on-acc);border-color:currentColor}
.nav a.soon{color:var(--ink-3)}
.nav .cnt{margin-left:auto;font-family:var(--f-mono);font-size:.68rem;border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--ink-2)}
.nav .soon .cnt{border-style:dashed}
.sub-nav{display:flex;flex-direction:column;margin:2px 0 6px 18px;padding-left:10px;border-left:1px solid var(--line)}
.sub-nav a{padding:5px 10px;font-size:.86rem;color:var(--ink-2)}
.sub-nav a .num{font-family:var(--f-mono);font-size:.74rem;color:var(--ink-3);min-width:2.1em}
.sub-nav a[aria-current="page"] .num{color:var(--on-acc)}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);font-size:.8rem;color:var(--ink-2)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;gap:12px;align-items:center;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(clamp(16px,2.6vw,40px), env(safe-area-inset-left,0px));padding-right:max(clamp(16px,2.6vw,40px), env(safe-area-inset-right,0px))}
.menu-btn{display:none;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;font-family:var(--f-mono);font-size:.78rem;cursor:pointer}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--f-mono);font-size:.78rem;color:var(--ink-3);min-width:0}
.crumbs a{color:var(--ink-2);text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.crumbs .sep{color:var(--line)}
.search{position:relative;margin-left:auto;flex:0 1 380px;min-width:0}
.search input{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;font-size:.88rem;color:var(--ink)}
.results{position:absolute;right:0;left:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.14);max-height:60vh;overflow:auto;padding:6px}
.results a{display:grid;gap:1px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink)}
.results a:hover,.results a:focus{background:var(--acc-2)}
.results .k{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
.results .none{padding:8px 10px;color:var(--ink-2);font-size:.88rem}

.page{padding-block:28px 64px;padding-left:max(clamp(16px,2.6vw,40px), env(safe-area-inset-left,0px));padding-right:max(clamp(16px,2.6vw,40px), env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:26px}
.page-h{display:flex;flex-direction:column;gap:10px;max-width:72ch}
.lead{font-size:1.05rem;color:var(--ink-2)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-family:var(--f-mono);font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--ink-2);background:var(--panel)}
.pill.t-comprendre{color:var(--acc);border-color:var(--acc)}
.pill.t-remplacer{color:var(--hot);border-color:var(--hot)}
.pill.t-regler{color:var(--ok);border-color:var(--ok)}
.pill.t-entretenir{color:var(--ink);border-color:var(--ink-2)}
.pill.lot{border-style:dashed}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.box > .label{display:block;margin-bottom:8px}
.nm{font-family:var(--f-mono);font-weight:600;font-size:.86em;color:var(--hot);background:var(--hot-2);padding:1px 6px;border-radius:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.verif{font-family:var(--f-mono);font-size:.78em;color:var(--acc);border:1px dashed var(--acc);border-radius:4px;padding:0 5px;white-space:nowrap}
.src{font-family:var(--f-mono);font-size:.7rem;color:var(--ink-3);border:1px solid var(--line-2);border-radius:4px;padding:0 5px;white-space:nowrap}

/* Mon vélo */
.home{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(300px,1fr);gap:22px;align-items:start}
.stage{position:relative;background:var(--studio);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stage img{display:block;width:100%;height:auto;max-width:100%}
.stage .views{position:absolute;left:14px;top:14px;display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.stage .views span{font-family:var(--f-mono);font-size:.72rem;padding:4px 10px;border-radius:999px;color:var(--ink-2)}
.stage .views span.on{background:var(--acc);color:var(--on-acc)}
.stage .cap{position:absolute;left:14px;right:14px;bottom:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stage .cap span{font-family:var(--f-mono);font-size:.72rem;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--ink-2)}
.zones{display:flex;flex-direction:column;gap:12px}
.zone{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.zone-h{display:flex;align-items:center;gap:10px}
.pin{width:26px;height:26px;border-radius:50%;background:var(--acc);color:var(--on-acc);font:600 .74rem/26px var(--f-mono);text-align:center;flex:none}
.zone ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.zone li a{display:flex;gap:8px;align-items:baseline;padding:5px 6px;border-radius:6px;text-decoration:none;color:var(--ink)}
.zone li a:hover{background:var(--acc-2)}
.zone li .num{font-family:var(--f-mono);font-size:.76rem;color:var(--acc);min-width:2.2em}
.zone li .ty{margin-left:auto;font-family:var(--f-mono);font-size:.66rem;color:var(--ink-3)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:22px}
.swap{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.swap li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line-2);align-items:baseline}
.swap li:first-child{border-top:0}
.swap .what{font-weight:600}
.swap .from{grid-column:1;font-size:.86rem;color:var(--ink-2)}
.swap .go{grid-row:1 / span 2;grid-column:2;align-self:center;font-family:var(--f-mono);font-size:.74rem;text-decoration:none;white-space:nowrap}
.swap .go.soon{color:var(--ink-3)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.cat{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);text-decoration:none;color:var(--ink);min-height:120px}
.cat:hover{border-color:var(--acc)}
.cat.soon{background:transparent;border-style:dashed;color:var(--ink-2)}
.cat .label{color:var(--acc)}
.cat.soon .label{color:var(--ink-3)}
.cat h3{font-size:1.25rem}
.cat p{font-size:.86rem;color:var(--ink-2)}

/* Catégorie */
.cat-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,340px);gap:24px;align-items:start}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-family:var(--f-mono);font-size:.76rem;cursor:pointer;color:var(--ink-2)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);text-decoration:none;color:var(--ink)}
.card:hover{border-color:var(--acc)}
.card .top-row{display:flex;align-items:center;gap:8px}
.card .n{font-family:var(--f-disp);font-weight:800;font-stretch:75%;font-size:1.6rem;color:var(--acc);line-height:1}
.card .top-row .pill{margin-left:auto}
.card h3{font-size:1.15rem}
.card .facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;font-size:.84rem;margin:0}
.card .facts dt{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);padding-top:2px}
.card .facts dd{margin:0;color:var(--ink-2)}
.order{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.order a{display:flex;gap:6px;align-items:center;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);text-decoration:none;color:var(--ink);font-size:.88rem}
.order a .num{font-family:var(--f-mono);font-size:.74rem;color:var(--acc)}
.order .arr{color:var(--ink-3);font-family:var(--f-mono)}
table.tq{width:100%;border-collapse:collapse;font-size:.84rem}
table.tq td{padding:7px 0;border-top:1px solid var(--line-2);vertical-align:top}
table.tq tr:first-child td{border-top:0}
table.tq td:last-child{text-align:right;padding-left:10px;white-space:nowrap}

/* Atelier */
.at-h{display:flex;flex-direction:column;gap:12px}
.at-h .num{font-family:var(--f-mono);font-size:.8rem;color:var(--acc)}
.fromto{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.92rem}
.fromto .k{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.fromto .v{padding:3px 10px;border-radius:6px;background:var(--panel);border:1px solid var(--line)}
.fromto .v.new{background:var(--hot-2);border-color:var(--hot);color:var(--hot);font-weight:600}
.at-layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,.9fr);gap:26px;align-items:start}
.at-right{position:sticky;top:74px;display:flex;flex-direction:column;gap:14px}
.warn{display:flex;gap:12px;border-left:3px solid var(--stop);background:var(--stop-2);padding:12px 14px;border-radius:0 8px 8px 0}
.warn .label{color:var(--stop)}
.warn ul{margin:6px 0 0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.steps-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;font-family:var(--f-mono);font-size:.78rem;cursor:pointer;color:var(--ink)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.steps{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
.step + .step{border-top:1px solid var(--line-2)}
.step-h{display:grid;grid-template-columns:2.2rem minmax(0,1fr) auto 1rem;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:12px 16px;cursor:pointer}
.step-h:hover{background:var(--acc-2)}
.step-h .n{font-family:var(--f-disp);font-weight:800;font-stretch:75%;font-size:1.35rem;color:var(--acc);line-height:1}
.step-h .t{font-weight:600}
.step-h .chev{font-family:var(--f-mono);color:var(--ink-3);transition:transform .15s}
.step-h[aria-expanded="true"] .chev{transform:rotate(90deg)}
.step-b{padding:0 16px 14px calc(16px + 2.2rem + 12px);color:var(--ink-2);display:flex;flex-direction:column;gap:8px;max-width:80ch}
.right-tabs{display:flex;gap:4px;margin-bottom:10px}
.right-tabs button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px;font-family:var(--f-mono);font-size:.72rem;cursor:pointer;color:var(--ink-2)}
.right-tabs button[aria-pressed="true"]{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.plate-art{background:var(--plate);border:1px solid var(--line);border-radius:8px;padding:8px}
.plate-art svg{display:block;width:100%;height:auto}
.ph3d{display:grid;place-items:center;text-align:center;aspect-ratio:4/3;max-width:100%;background:var(--studio);border:1px solid var(--line);border-radius:8px;color:var(--ink-2);font-size:.86rem;padding:20px}
.ph3d b{display:block;font-family:var(--f-disp);font-stretch:80%;font-size:1.2rem;color:var(--ink);margin-bottom:4px}
.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.check li + li{border-top:1px solid var(--line-2)}
.check label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:.9rem;cursor:pointer}
.check input{accent-color:var(--acc);width:1.05rem;height:1.05rem;margin:.18rem 0 0;flex:none}
.check input:checked + span{color:var(--ink-3);text-decoration:line-through}
.vid{display:grid;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink);background:var(--bg)}
.vid + .vid{margin-top:8px}
.vid:hover{border-color:var(--acc)}
.vid .k{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
.prevnext{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prevnext a{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);text-decoration:none;color:var(--ink)}
.prevnext a:hover{border-color:var(--acc)}
.prevnext a.next{text-align:right}
.prevnext .label{color:var(--acc)}
.blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.blocks .box h3{margin-bottom:4px}

/* Pas à pas */
.focus{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-block:max(20px, env(safe-area-inset-top,0px)) max(20px, env(safe-area-inset-bottom,0px));padding-left:max(clamp(16px,4vw,64px), env(safe-area-inset-left,0px));padding-right:max(clamp(16px,4vw,64px), env(safe-area-inset-right,0px))}
.focus-top{display:flex;align-items:center;gap:12px}
.focus-top .bar{flex:1;height:6px;border-radius:999px;background:var(--line-2);overflow:hidden}
.focus-top .bar i{display:block;height:100%;background:var(--acc);transition:width .2s}
.focus-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;max-width:62rem;margin-inline:auto;width:100%;min-height:0}
.focus-body .big{font-family:var(--f-disp);font-weight:800;font-stretch:72%;font-size:clamp(4rem,10vw,8rem);line-height:.9;color:var(--acc)}
.focus-body h2{font-size:clamp(1.8rem,3.6vw,3rem)}
.focus-body p{font-size:clamp(1.05rem,1.6vw,1.35rem);color:var(--ink-2);max-width:60ch}
.focus-nav{display:flex;justify-content:space-between;gap:12px}
.focus-nav .btn{padding:12px 22px;font-size:.9rem}

.note{border:1px dashed var(--ink-3);border-radius:var(--r);padding:12px 16px;font-size:.88rem;color:var(--ink-2);background:var(--panel)}
.note .label{display:block;margin-bottom:4px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.tbl table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:34rem}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:8px 14px;border-bottom:1px solid var(--line-2)}
.tbl th{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);background:var(--bg)}
.tbl tr.grp td{font-family:var(--f-disp);font-weight:800;font-stretch:80%;font-size:1.05rem;background:var(--plate)}
.tbl tr:last-child td{border-bottom:0}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.tools .box{display:flex;flex-direction:column;gap:6px;padding:12px 14px}
.tools .uses{display:flex;flex-wrap:wrap;gap:6px}
.tools .uses a{font-family:var(--f-mono);font-size:.72rem;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.soon-list{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}

/* Planche SVG (classes du site) */
svg .ln{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg .ln2{fill:none;stroke:var(--ink);stroke-width:1;stroke-linecap:round;stroke-linejoin:round}
svg .dim{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:4 3}
svg .fl{fill:var(--panel);stroke:var(--ink);stroke-width:1.4;stroke-linejoin:round}
svg .fl2{fill:var(--line-2);stroke:var(--ink);stroke-width:1.2;stroke-linejoin:round}
svg .fl3{fill:var(--line);stroke:var(--ink);stroke-width:1.2;stroke-linejoin:round}
svg .ac2f{fill:var(--acc-2);stroke:var(--acc);stroke-width:1.4}
svg .stf{fill:var(--stop)}
svg .stl{fill:none;stroke:var(--stop);stroke-width:2;stroke-linecap:round}
svg .mk{fill:var(--ink)} svg .mka{fill:var(--acc)} svg .mkh{fill:var(--hot)}
svg .t{fill:var(--ink);font-family:var(--f-mono);font-size:11px}
svg .t2{fill:var(--ink-2);font-family:var(--f-mono);font-size:10px}
svg .tb{font-weight:600} svg .ta{fill:var(--acc)} svg .th{fill:var(--hot)} svg .ts{fill:var(--stop)} svg .tc{text-anchor:middle}

}

var A23 = {"steps": [{"t": "Sors les anciennes plaquettes", "b": "Dépose la roue. Retire le clip de retenue, puis l'axe, puis les plaquettes avec leur ressort."}, {"t": "Monte l'entonnoir sur la manette", "b": "Retourne le repose-main par l'avant, place le haut de la vis de purge parallèle au sol, retire la vis et son joint torique, et visse l'entonnoir TL-BR002 à la place. Pour poser et retirer l'entonnoir, Shimano renvoie à la section purge : étapes 2 et 10 de la section 2.7."}, {"t": "Nettoie et repousse les pistons", "b": "Nettoie les pistons et leur pourtour. Repousse-les à fond, bien droit, avec l'outil plat, sans les tordre et sans outil pointu. Sur les étriers Shimano flat mount, appuie de façon égale : les pistons sont en céramique."}, {"t": "Retire l'entonnoir et referme la manette", "b": "Shimano fait retirer l'entonnoir une fois les pistons repoussés. Comme en fin de purge : bouche l'entonnoir avec la butée d'huile, retire-le, puis remonte la vis de purge avec son joint torique à 0,5-0,7 Nm, sans toucher au levier. Essuie l'huile qui déborde."}, {"t": "Prépare les plaquettes neuves", "b": "Place le ressort sur les plaquettes neuves, en respectant les repères L et R."}, {"t": "Monte l'ensemble et serre l'axe", "b": "Glisse l'ensemble dans l'étrier, passe l'axe et serre-le au couple de ton étrier : 1-1,5 Nm sur BR-RX820 et RX410, 0,2-0,4 Nm sur BR-RX400 et RX810. Remets le clip."}, {"t": "Pose la cale rouge", "b": "Glisse la cale de plaquettes rouge entre les plaquettes."}, {"t": "Pompe le levier", "b": "Actionne le levier quelques fois, jusqu'à ce qu'il soit ferme."}, {"t": "Remonte la roue", "b": "Retire la cale et remonte la roue. Vérifie que le disque ne touche pas les plaquettes. S'il touche, contrôle d'abord que la roue est bien montée, puis centre l'étrier : 2.5."}, {"t": "Rode", "b": "Shimano demande un rodage après chaque changement de plaquettes : 2.4."}], "warn": ["Deux idées reçues Le TL-BH62 ne sert pas à repousser les pistons : Shimano l'emploie pour couper la durite et insérer le raccord. Pour les pistons, il demande un outil plat, jamais un outil pointu . L'entonnoir se monte sur la manette avant de repousser les pistons. Sinon, la pression de l'huile peut endommager la membrane de la manette ."], "svg": "<svg viewBox=\"0 0 340 340\" role=\"img\" aria-labelledby=\"freins-pl-2-t\"><title id=\"freins-pl-2-t\">Vue éclatée de chant des plaquettes : axe, plaquette L, ressort, plaquette R et clip de retenue, avec le couple de l'axe. En bas, limite d'usure : à 0,5 mm de garniture, la plaquette est à changer.<\/title><defs><marker id=\"freins-mk-2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"9\" markerHeight=\"9\" markerUnits=\"userSpaceOnUse\" orient=\"auto-start-reverse\"><path class=\"mk\" d=\"M0,1 L10,5 L0,9 Z\"/><\/marker><marker id=\"freins-mka-2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"9\" markerHeight=\"9\" markerUnits=\"userSpaceOnUse\" orient=\"auto-start-reverse\"><path class=\"mka\" d=\"M0,1 L10,5 L0,9 Z\"/><\/marker><marker id=\"freins-mkh-2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"9\" markerHeight=\"9\" markerUnits=\"userSpaceOnUse\" orient=\"auto-start-reverse\"><path class=\"mkh\" d=\"M0,1 L10,5 L0,9 Z\"/><\/marker><marker id=\"freins-mks-2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"9\" markerHeight=\"9\" markerUnits=\"userSpaceOnUse\" orient=\"auto-start-reverse\"><path class=\"stf\" d=\"M0,1 L10,5 L0,9 Z\"/><\/marker><\/defs><line class=\"dim\" x1=\"6\" y1=\"70\" x2=\"300\" y2=\"70\"/><rect class=\"fl2\" x=\"10\" y=\"61\" width=\"9\" height=\"18\" rx=\"2\"/><rect class=\"fl\" x=\"19\" y=\"66.5\" width=\"55\" height=\"7\" rx=\"2\"/><line class=\"ln2\" x1=\"58\" y1=\"66.5\" x2=\"60.5\" y2=\"73.5\"/><line class=\"ln2\" x1=\"62\" y1=\"66.5\" x2=\"64.5\" y2=\"73.5\"/><line class=\"ln2\" x1=\"66\" y1=\"66.5\" x2=\"68.5\" y2=\"73.5\"/><line class=\"ln2\" x1=\"70\" y1=\"66.5\" x2=\"72.5\" y2=\"73.5\"/><line class=\"ln\" x1=\"80\" function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function nmify(s){return esc(s).replace(/(\d+(?:,\d+)?(?:-\d+(?:,\d+)?)?)\s?Nm/g,'<span class="nm">$1 Nm</span>');}
function val(v){return v==='non publié' ? '<span class="verif">non publié</span>' : '<span class="nm">'+esc(v)+'</span>';}
function pill(t){return '<span class="pill t-'+t+'">'+TYPES[t]+'</span>';}

    right += '<div class="box"><span class="label">Vidéo du geste</span>'+a.videos.map(function(v){return '<a class="vid" href="'+v[2]+'" target="_blank" rel="noopener"><span class="k">Vidéo · '+esc(v[0])+' · en anglais</span><span>'+esc(v[1])+'</span>'+(v[3]?'<span class="muted" style="font-size:.82rem">'+esc(v[3])+'</span>':'')+'</a>';}).join('')+'</div>';
  }
  var pn = '<div class="prevnext">'+(prev?'<a href="#'+prev.id+'"><span class="label">← Précédent</span><span>'+prev.n+' '+esc(prev.titre)+'</span></a>':'<span></span>')+(next?'<a class="next" href="#'+next.id+'"><span class="label">Suivant →</span><span>'+next.n+' '+esc(next.titre)+'</span></a>':'<span></span>')+'</div>';
  return head + '<div class="at-layout"><div style="display:flex;flex-direction:column;gap:14px;min-width:0">'+left+'</div><aside class="at-right">'+right+'</aside></div>' + pn;
}

function pageSoon(s){
  crumbs([['Ateliers'],[s.titre]]);
  return '<div class="page-h"><span class="label">Lot '+s.lot+' · à venir</span><h1>'+esc(s.titre)+'</h1><p class="lead">Cette catégorie aura la même forme que Freins : une grille d’ateliers, puis une page par atelier.</p></div><div class="box" style="max-width:72ch"><span class="label">Prévu</span><ul class="soon-list">'+s.items.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>';
}

function pageComposants(){
  crumbs([['Références'],['Composants d’origine']]);
  var rows = COMPOSANTS.map(function(g){return '<tr class="grp"><td colspan="3">'+esc(g[0])+'</td></tr>'+g[1].map(function(r){return '<tr><td>'+esc(r[0])+'</td><td class="mono" style="font-size:.86rem">'+esc(r[1])+'</td><td class="muted">'+esc(r[2])+'</td></tr>';}).join('');}).join('');
  return '<div class="page-h"><span class="label">Fiche Canyon suisse, taille M</span><h1>Composants d’origine</h1><p class="lead">Ce que Canyon monte sur ton Grizl CF 7, relevé sur la fiche officielle.</p></div><div class="tbl"><table><thead><tr><th>Pièce</th><th>Référence</th><th>Précisions</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

function pageOutils(){
  crumbs([['Références'],['Outils']]);
  var map = {};
  A.forEach(function(a){ (a.outils||[]).forEach(function(o){ (map[o]=map[o]||[]).push(a); }); });
  var keys = Object.keys(map).sort(function(x,y){return map[y].length-map[x].length || x.localeCompare(y,'fr');});
  return '<div class="page-h"><span class="label">Tirée des ateliers</span><h1>Outils</h1><p class="lead">Chaque outil cité dans un atelier, avec les ateliers qui en ont besoin. Utile pour préparer ton établi.</p></div><div class="tools">'+keys.map(function(k){return '<div class="box"><span>'+esc(k)+'</span><div class="uses">'+map[k].map(function(a){return '<a href="#'+a.id+'">'+a.n+'</a>';}).join('')+'</div></div>';}).join('')+'</div>';
}

function pageCouples(){
  crumbs([['Références'],['Couples de serrage']]);
  return '<div class="page-h"><span class="label">Lots validés seulement</span><h1>Couples de serrage</h1><p class="lead">Tous les couples du site sur une seule page, groupés par catégorie. Pour l’instant : les freins.</p></div><div class="box" style="max-width:720px"><span class="label">Freins</span><table class="tq">'+COUPLES_FREINS.map(function(r){return '<tr><td>'+esc(r[0])+'</td><td>'+val(r[1])+'</td></tr>';}).join('')+'</table></div>';
}

function pagePlaceholder(id){
  var p = {
    approche:['Ce qui est approché','La liste du bouton « Ce qui est approché », sur sa propre page, groupée par pièce : cadre et fourche, roues et pneus, freins, transmission, poste de pilotage, géométrie. Avec, pour chaque groupe, ce qu’il faut vérifier à la livraison.'],
    sources:['Sources','Tous les documents officiels utilisés, avec leur lien et ce qu’ils justifient : fiche Canyon, manuels Shimano, DT Swiss, Continental. Park Tool pour les gestes seulement.']
  }[id];
  crumbs([['Références'],[p[0]]]);
  return '<div class="page-h"><span class="label">Référence</span><h1>'+p[0]+'</h1><p class="lead">'+p[1]+'</p></div>';
}

/* Routeur */
function route(){
  var h = (location.hash||'').replace('#','') || 'velo';
  if (h==='velo') return {page:'velo'};
  if (h==='freins') return {page:'freins'};
  if (BYID[h]) return {page:'atelier', id:h};
  for (var i=0;i<SOON.length;i++) if (SOON[i].id===h) return {page:'soon', id:h};
  if (['composants','outils','couples','approche','sources'].indexOf(h)>=0) return {page:h};
  return {page:'velo'};
}
function render(){
  var r = route(), html;
  if (r.page==='velo') html = pageVelo();
  else if (r.page==='freins') html = pageFreins();
  else if (r.page==='atelier') html = pageAtelier(BYID[r.id]);
  else if (r.page==='soon') html = pageSoon(SOON.filter(function(s){return s.id===r.id;})[0]);
  else if (r.page==='composants') html = pageComposants();
  else if (r.page==='outils') html = pageOutils();
  else if (r.page==='couples') html = pageCouples();
  else html = pagePlaceholder(r.page);
  renderNav(r);
  var pg = document.getElementById('page');
  pg.innerHTML = html;
  wire(r);
  closeMenu();
  window.scrollTo(0,0);
}

function wire(r){
  var fl = document.getElementById('filters');
  if (fl) fl.addEventListener('click', function(e){ var b = e.target.closest('button'); if(!b) return; filtre = b.getAttribute('data-f'); render(); });
  document.querySelectorAll('.step-h').forEach(function(b){
    b.addEventListener('click', function(){ var open = b.getAttribute('aria-expanded')==='true'; b.setAttribute('aria-expanded', String(!open)); document.getElementById(b.getAttribute('aria-controls')).hidden = open; });
  });
  var all = document.getElementById('allBtn');
  if (all) all.addEventListener('click', function(){
    var hs = document.querySelectorAll('.step-h'); var anyClosed = Array.prototype.some.call(hs,function(b){return b.getAttribute('aria-expanded')!=='true';});
    hs.forEach(function(b){ b.setAttribute('aria-expanded', String(anyClosed)); document.getElementById(b.getAttribute('aria-controls')).hidden = !anyClosed; });
    all.textContent = anyClosed ? 'Tout replier' : 'Tout déplier';
  });
  var fb = document.getElementById('focusBtn');
  if (fb) fb.addEventListener('click', function(){ openFocus(BYID[r.id], 0); });
  var rt = document.getElementById('rtabs');
  if (rt) rt.addEventListener('click', function(e){ var b = e.target.closest('button'); if(!b) return; rt.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed', String(x===b));}); document.getElementById('rv-pl').hidden = b.getAttribute('data-v')!=='pl'; document.getElementById('rv-3d').hidden = b.getAttribute('data-v')!=='3d'; });
}

/* Mode pas à pas */
var FA = null, FI = 0;
function openFocus(a, i){ FA = a; FI = i; drawFocus(); document.getElementById('focus').hidden = false; document.body.style.overflow='hidden'; }
function closeFocus(){ document.getElementById('focus').hidden = true; document.body.style.overflow=''; FA = null; }
function drawFocus(){
  var n = FA.etapes.length, b = FA.corps ? FA.corps[FI] : 'Le texte de cette étape reste celui du site actuel.';
  document.getElementById('focus').innerHTML =
    '<div class="focus-top"><span class="label">'+FA.n+' '+esc(FA.titre)+'</span><div class="bar"><i style="width:'+((FI+1)/n*100)+'%"></i></div><span class="mono" style="font-size:.8rem">'+(FI+1)+' / '+n+'</span><button class="btn" type="button" id="fClose">Fermer</button></div>' +
    '<div class="focus-body"><span class="big">'+(FI+1)+'</span><h2>'+esc(FA.etapes[FI])+'</h2><p>'+nmify(b)+'</p></div>' +
    '<div class="focus-nav"><button class="btn" type="button" id="fPrev"'+(FI===0?' disabled':'')+'>← Étape précédente</button><button class="btn pri" type="button" id="fNext">'+(FI===n-1?'Terminé':'Étape suivante →')+'</button></div>';
  document.getElementById('fClose').onclick = closeFocus;
  document.getElementById('fPrev').onclick = function(){ if(FI>0){FI--;drawFocus();} };
  document.getElementById('fNext').onclick = function(){ if(FI<n-1){FI++;drawFocus();} else closeFocus(); };
}
document.addEventListener('keydown', function(e){
  if (!FA) return;
  if (e.key==='ArrowRight' && FI<FA.etapes.length-1){FI++;drawFocus();}
  else if (e.key==='ArrowLeft' && FI>0){FI--;drawFocus();}
  else if (e.key==='Escape') closeFocus();
});

/* Menu sur téléphone */
var side = document.getElementById('side'), mb = document.getElementById('menuBtn');
function closeMenu(){ side.classList.remove('open'); mb.setAttribute('aria-expanded','false'); }
mb.addEventListener('click', function(){ var o = side.classList.toggle('open'); mb.setAttribute('aria-expanded', String(o)); });

/* Recherche */
var IDX = [];
A.forEach(function(a){
  IDX.push({k:'Atelier '+a.n, t:a.titre, h:a.id});
  (a.etapes||[]).forEach(function(s){ IDX.push({k:'Étape · '+a.n, t:s, h:a.id}); });
  (a.outils||[]).forEach(function(o){ IDX.push({k:'Outil · '+a.n, t:o, h:a.id}); });
});
COMPOSANTS.forEach(function(g){ g[1].forEach(function(r){ IDX.push({k:'Pièce d’origine', t:r[0]+' : '+r[1], h:'composants'}); }); });
SOON.forEach(function(s){ IDX.push({k:'Lot '+s.lot+' · à venir', t:s.titre, h:s.id}); });
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
var q = document.getElementById('q'), res = document.getElementById('results');
q.addEventListener('input', function(){
  var v = norm(q.value.trim());
  if (v.length<2){ res.hidden = true; return; }
  var hits = IDX.filter(function(x){return norm(x.t).indexOf(v)>=0;}).slice(0,12);
  res.innerHTML = hits.length ? hits.map(function(x){return '<a href="#'+x.h+'"><span class="k">'+esc(x.k)+'</span><span>'+esc(x.t)+'</span></a>';}).join('') : '<div class="none">Rien trouvé pour « '+esc(q.value)+' ».</div>';
  res.hidden = false;
});
res.addEventListener('click', function(){ res.hidden = true; q.value=''; });
document.addEventListener('click', function(e){ if (!e.target.closest('.search')) res.hidden = true; });

window.addEventListener('hashchange', render);
render();
})();
</script>
