<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Guide d'atelier pour monter, régler et réparer soi-même le Canyon Grizl CF 7.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<script>
/* JavaScript actif : la classe « js » est posée avant l'affichage. La feuille de style s'en sert pour replier le menu
   derrière son bouton sur téléphone et pour montrer la recherche, les filtres et la barre des étapes, que le module
   commun du site fait marcher. Sans JavaScript, rien de cela : le menu reste en tête de page et rien n'est caché.
   Le module commun s'exécute avant DOMContentLoaded et pose alors window.siteBranche. S'il n'a pas tourné (fichier
   absent ou bloqué, navigateur trop ancien pour le lire), la classe tombe et la page reprend la mise en page sans
   JavaScript : le menu reste atteignable. */
document.documentElement.classList.add('js');
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', function () {
    if (!window.siteBranche) document.documentElement.classList.remove('js');
  });
}
</script>
<style>
/* Mise en page : application d'atelier pour l'ordinateur, d'après la maquette validée le 21 octobre
   (docs/superpowers/specs/2026-10-21-maquette-site.html). Menu des catégories fixe à gauche, barre du haut avec fil
   d'Ariane et recherche, contenu en pleine largeur. Un atelier tient sur deux colonnes : le texte à gauche, et à droite,
   collées à l'écran, la planche ou la pièce 3D, la liste « Il te faut », les couples et la vidéo.
   Points de rupture : deux colonnes au-dessus de 1100 px, une seule en dessous, menu derrière son bouton sous 900 px. */
:root{
  --bg:#EDF0EF; --panel:#F9FAFA; --plate:#E3E8E9; --side:#E4E9E8;
  --ink:#16202A; --ink-2:#465462; --ink-3:#6F7D89;
  --ink-nav:#5A6773; /* texte discret du menu et du fil d'Ariane : 4,5:1 au moins sur --side et --bg */
  --line:#C6CFD4; --line-2:#DAE1E4;
  --acc:#56479A; --acc-2:#E9E5F6; --on-acc:#FFFFFF;
  --hot:#9E4C06; --hot-2:#FAE8D6;
  --ok:#2B724A; --ok-2:#DFF0E5;
  --stop:#AE2A20; --stop-2:#F7E0DC;
  --studio-hi:#FDFDFD; --studio-lo:#D5DADD; --shadow:rgba(22,32,42,.18);
  --f-disp:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
  --side-w:288px; /* largeur du menu */
  /* Hauteur de la barre du haut, pour les ancres et la colonne de droite : une estimation ici, puis la mesure exacte,
     posée par le module commun sur l'élément racine. */
  --top-h:42px;
  --gut:max(clamp(16px,2.6vw,40px),env(safe-area-inset-left,0px)); /* marges du contenu */
  --gut-r:max(clamp(16px,2.6vw,40px),env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151A; --panel:#161D23; --plate:#19222A; --side:#0C1115;
    --ink:#E3E9ED; --ink-2:#A6B3BD; --ink-3:#7A8893; --ink-nav:#7A8893;
    --line:#2D3842; --line-2:#222B33;
    --acc:#B1A5F0; --acc-2:#272242; --on-acc:#16112B;
    --hot:#F2A766; --hot-2:#3A2816;
    --ok:#78CB9E; --ok-2:#16321F;
    --stop:#F48B81; --stop-2:#3E1D1A;
    --studio-hi:#3A424A; --studio-lo:#14191E; --shadow:rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
.js{--top-h:57px}
:root[data-theme="dark"]{
  --bg:#10151A; --panel:#161D23; --plate:#19222A; --side:#0C1115;
  --ink:#E3E9ED; --ink-2:#A6B3BD; --ink-3:#7A8893; --ink-nav:#7A8893;
  --line:#2D3842; --line-2:#222B33;
  --acc:#B1A5F0; --acc-2:#272242; --on-acc:#16112B;
  --hot:#F2A766; --hot-2:#3A2816;
  --ok:#78CB9E; --ok-2:#16321F;
  --stop:#F48B81; --stop-2:#3E1D1A;
  --studio-hi:#3A424A; --studio-lo:#14191E; --shadow:rgba(0,0,0,.45);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
input,select,textarea{font:inherit;font-size:16px}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--top-h) + 12px);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:var(--acc);text-underline-offset:2px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
p{margin:0 0 .75em}
ul,ol{margin:0 0 1em;padding-left:1.25em}
strong{font-weight:600}
h1,h2,h3,h4{font-family:var(--f-disp);text-wrap:balance;margin:0;line-height:1.08}
h1{font-size:clamp(2rem,3.4vw,3rem);font-weight:800;font-stretch:74%;letter-spacing:-.005em}
h2{font-size:1.45rem;font-weight:800;font-stretch:80%}
h3{font-size:1.15rem;font-weight:700;font-stretch:88%}
h4{font-family:var(--f-mono);font-size:.74rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:0 0 .5rem}
.label{font-family:var(--f-mono);font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.eyebrow,.ch-num{font-family:var(--f-mono);font-size:.75rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin:0 0 .55rem}
.lead,.ch-lead{font-size:1.05rem;color:var(--ink-2);max-width:72ch}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}
.num,.cnt,.st-n{font-variant-numeric:tabular-nums}

/* Squelette : le menu à gauche, puis la barre du haut, le contenu et le pied */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;height:100dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--side);border-right:1px solid var(--line);padding:22px 14px 24px;display:flex;flex-direction:column;gap:22px}
.brand{padding:0 8px}
.brand .label{color:var(--acc)}
.brand .name{font-family:var(--f-disp);font-weight:800;font-stretch:72%;font-size:1.9rem;line-height:1;margin-top:6px;color:var(--ink)}
.nav{display:flex;flex-direction:column;gap:18px}
.nav-g{display:flex;flex-direction:column;gap:2px}
.nav-g > .label{padding:0 10px 6px;color:var(--ink-nav)}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:.95rem;line-height:1.35}
.nav a:hover{background:var(--panel)}
.nav a[aria-current="page"]{background:var(--acc);color:var(--on-acc)}
.nav a[aria-current="page"] .cnt{color:var(--on-acc);border-color:currentColor}
.nav a.soon{color:var(--ink-nav)}
.nav a.soon[aria-current="page"]{color:var(--on-acc)}
.nav .cnt{margin-left:auto;flex:none;font-family:var(--f-mono);font-size:.68rem;line-height:1.5;border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--ink-2);white-space:nowrap}
.nav .soon .cnt{border-style:dashed}
.sub-nav{display:flex;flex-direction:column;margin:2px 0 6px 18px;padding-left:10px;border-left:1px solid var(--line)}
.sub-nav a{align-items:baseline;padding:5px 10px;font-size:.86rem;color:var(--ink-2)}
.sub-nav a .num{flex:none;font-family:var(--f-mono);font-size:.74rem;color:var(--ink-nav);min-width:2.1em}
.sub-nav a[aria-current="page"] .num{color:var(--on-acc)}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);font-size:.8rem;line-height:1.5;color:var(--ink-2)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;gap:12px;align-items:center;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px;padding-left:var(--gut);padding-right:var(--gut-r)}
.menu-btn{display:none;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;font-family:var(--f-mono);font-size:.78rem;cursor:pointer}
.crumbs{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-family:var(--f-mono);font-size:.78rem;color:var(--ink-nav);min-width:0}
.crumbs a{color:var(--ink-2);text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.crumbs .sep{color:var(--line)}
.search{display:none;position:relative;margin-left:auto;flex:0 1 clamp(220px,28vw,380px);min-width:0}
.js .search{display:block}
.search input{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:.88rem;color:var(--ink)}
.results{position:absolute;right:0;left:0;top:calc(100% + 6px);z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px var(--shadow);max-height:60vh;overflow:auto;padding:6px}
.results a{display:grid;gap:1px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink);line-height:1.35}
.results a:hover,.results a:focus{background:var(--acc-2)}
.results a:focus-visible{outline-offset:-2px}
.results .k{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
.results .none{margin:0;padding:8px 10px;color:var(--ink-2);font-size:.88rem}

.page{flex:1;display:flex;flex-direction:column;gap:26px;padding-block:28px 64px;padding-left:var(--gut);padding-right:var(--gut-r);min-width:0}
.footer{padding-block:20px calc(28px + env(safe-area-inset-bottom,0px));padding-left:var(--gut);padding-right:var(--gut-r);border-top:1px solid var(--line);font-size:.84rem;color:var(--ink-2)}
.footer p{max-width:90ch}
.footer p:last-child{margin-bottom:0}

/* En-têtes de page, pastilles, statut des lots */
.page-h{display:flex;flex-direction:column;gap:10px;max-width:72ch}
.page-h > *{margin:0}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-family:var(--f-mono);font-size:.72rem;line-height:1.6;border:1px solid var(--line);border-radius:999px;padding:1px 10px;color:var(--ink-2);background:var(--panel)}
.pill.t-comprendre{color:var(--acc);border-color:var(--acc)}
.pill.t-remplacer{color:var(--hot);border-color:var(--hot)}
.pill.t-regler{color:var(--ok);border-color:var(--ok)}
.pill.t-entretenir{color:var(--ink);border-color:var(--ink-2)}
.lot-badge{display:inline-block;align-self:flex-start;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--hot);border:1px solid var(--hot);border-radius:999px;padding:2px 9px;margin:0 0 .6rem}
.lot-badge.ok{color:var(--ok);border-color:var(--ok)}
.lot-badge.soon{color:var(--ink-3);border:1px dashed var(--ink-3)}
.btn{font-family:var(--f-mono);font-size:.76rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--acc)}
.btn[aria-pressed="true"],.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn:disabled{opacity:.45;cursor:not-allowed;border-color:var(--line)}

/* Valeurs et marqueurs */
.nm{font-family:var(--f-mono);font-weight:600;font-size:.86em;color:var(--hot);background:var(--hot-2);padding:1px 6px;border-radius:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.verif{font-family:var(--f-mono);font-size:.78em;color:var(--acc);border:1px dashed var(--acc);border-radius:4px;padding:0 5px;white-space:nowrap}
a.src{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-3);text-decoration-style:dotted}
a.src::before{content:"↗ "}
.ref{font-family:var(--f-mono);font-size:.88em}

/* Encadrés */
.note{border-left:3px solid var(--acc);background:var(--acc-2);padding:10px 14px;border-radius:0 8px 8px 0;margin:1rem 0}
.note > :last-child{margin-bottom:0}
.note-t{font-family:var(--f-mono);font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.25rem}
.note.warn{border-color:var(--stop);background:var(--stop-2)}
.note.warn .note-t{color:var(--stop)}
.note.info .note-t{color:var(--acc)}
.note.tip{border-color:var(--ok);background:var(--ok-2)}
.note.tip .note-t{color:var(--ok)}
.note.prop{border:1px dashed var(--ink-3);border-left:3px dashed var(--ink-3);background:var(--panel)}
.note.prop .note-t{color:var(--ink-2)}

/* Encadré « Il te faut » */
.kit{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:12px 14px;margin:1rem 0}
.chips{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px}
.chips li{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.86rem;background:var(--bg)}

/* Étapes : chacune tient sur une ligne (numéro, titre, premier couple) et s'ouvre d'un clic */
ol.steps{list-style:none;padding:0;margin:1rem 0 1.4rem;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
li.step + li.step{border-top:1px solid var(--line-2)}
li.step > details{border:0;border-radius:0;background:none;margin:0}
li.step > details > summary{display:grid;grid-template-columns:2.2rem minmax(0,1fr) auto 1rem;gap:12px;align-items:center;padding:11px 16px;font-weight:400}
li.step > details > summary:hover{background:var(--acc-2);color:inherit}
li.step > details > summary:focus-visible{outline-offset:-2px}
li.step > details > summary::after{grid-column:4;margin:0;justify-self:end}
li.step > details > summary .nm{grid-column:3}
.st-n{font-family:var(--f-disp);font-weight:800;font-stretch:75%;font-size:1.35rem;line-height:1;color:var(--acc)}
.st-t{font-weight:600;min-width:0}
li.step .st-b{padding:0 16px 14px calc(16px + 2.2rem + 12px);color:var(--ink-2)}
li.step .st-b > :last-child{margin-bottom:0}

/* Planches 2D */
figure{margin:1.4rem 0}
.plate-art{background:var(--plate);border:1px solid var(--line);border-radius:var(--r);padding:10px;overflow-x:auto}
.plate-art svg{display:block;width:100%;height:auto;min-width:300px}
figcaption{font-size:.85rem;color:var(--ink-2);margin-top:.5rem}
.pl-n{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--acc);margin-right:.4em}
/* Classes de dessin SVG (aucune couleur en dur) */
svg .ln{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg .ln2{fill:none;stroke:var(--ink);stroke-width:1;stroke-linecap:round;stroke-linejoin:round}
svg .ln3{fill:none;stroke:var(--ink-2);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
svg .dim{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:4 3}
svg .fl{fill:var(--panel);stroke:var(--ink);stroke-width:1.4;stroke-linejoin:round}
svg .fl2{fill:var(--line-2);stroke:var(--ink);stroke-width:1.2;stroke-linejoin:round}
svg .fl3{fill:var(--line);stroke:var(--ink);stroke-width:1.2;stroke-linejoin:round}
svg .ink{fill:var(--ink)}
svg .ac{fill:none;stroke:var(--acc);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg .acf{fill:var(--acc)}
svg .ac2f{fill:var(--acc-2);stroke:var(--acc);stroke-width:1.4}
svg .ht{fill:none;stroke:var(--hot);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg .htf{fill:var(--hot)}
svg .ht2f{fill:var(--hot-2);stroke:var(--hot);stroke-width:1.4}
svg .okl{fill:none;stroke:var(--ok);stroke-width:2;stroke-linecap:round}
svg .okf{fill:var(--ok)}
svg .stl{fill:none;stroke:var(--stop);stroke-width:2;stroke-linecap:round}
svg .stf{fill:var(--stop)}
svg .t{fill:var(--ink);font-family:var(--f-mono);font-size:11px}
svg .t2{fill:var(--ink-2);font-family:var(--f-mono);font-size:10px}
svg .tb{font-weight:600}
svg .ta{fill:var(--acc)}
svg .th{fill:var(--hot)}
svg .to{fill:var(--ok)}
svg .ts{fill:var(--stop)}
svg .tc{text-anchor:middle}
svg .te{text-anchor:end}
svg .td{font-family:var(--f-disp);font-weight:700}
svg .badge{fill:var(--acc)}
svg .badge-t{fill:var(--on-acc);font-family:var(--f-mono);font-size:10px;font-weight:600;text-anchor:middle}
svg .mk{fill:var(--ink)}
svg .mka{fill:var(--acc)}
svg .mkh{fill:var(--hot)}

/* Tableaux */
.tbl{overflow-x:auto;margin:1rem 0 1.4rem;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.tbl table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:30rem}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:8px 12px;border-bottom:1px solid var(--line-2)}
.tbl th{font-family:var(--f-mono);font-size:.7rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);background:var(--bg)}
.tbl tr:last-child td{border-bottom:0}
.tbl td{font-variant-numeric:tabular-nums}
.tbl td.n{white-space:nowrap}
/* Tableau qui se replie en fiches sur téléphone : <div class="tbl stack"> et data-label="Titre de colonne" sur chaque <td> */
@media (max-width:560px){
  .tbl.stack table{min-width:0}
  .tbl.stack thead{display:none}
  .tbl.stack tr{display:block;padding:8px 0;border-bottom:1px solid var(--line-2)}
  .tbl.stack tr:last-child{border-bottom:0}
  .tbl.stack td{display:block;position:relative;border:0;padding:3px 12px 3px calc(12px + 7.2rem);min-height:1.6em}
  .tbl.stack td::before{content:attr(data-label);position:absolute;left:12px;top:5px;width:6.8rem;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
  .tbl.stack td.n{white-space:normal}
  .tbl.stack th[colspan]{display:block}
}

/* Vidéos et manuels */
ul.media{list-style:none;padding:0;margin:1rem 0 1.4rem;display:grid;gap:8px}
ul.media a{display:grid;gap:2px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);text-decoration:none;color:var(--ink)}
ul.media a:hover{border-color:var(--acc)}
.m-kind{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--acc)}
.m-title{font-weight:500}
.m-note{font-size:.84rem;color:var(--ink-2)}

/* Listes à cocher */
ul.check{list-style:none;padding:0;margin:1rem 0 1.4rem;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
ul.check li{border-bottom:1px solid var(--line-2)}
ul.check li:last-child{border-bottom:0}
ul.check label{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;cursor:pointer}
ul.check input{accent-color:var(--acc);width:1.15rem;height:1.15rem;margin:.2rem 0 0;flex:none}
ul.check input:checked + span{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-3)}
.check-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:1.2rem}
.check-head h4{margin:0}
.btn-reset{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-2);background:none;border:0;text-decoration:underline;cursor:pointer;padding:4px}

/* Pièces en 3D */
.v3d{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.v3d-stage{position:relative;width:100%;aspect-ratio:4/3;max-height:72vh;background:radial-gradient(120% 90% at 50% 35%,var(--panel),var(--plate))}
.v3d-stage canvas{display:block;width:100%;height:100%;touch-action:pan-y}
.v3d-stage.free canvas{touch-action:none}
.v3d-pins{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pin{position:absolute;left:0;top:0;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;border:2px solid var(--panel);background:var(--acc);color:var(--on-acc);font:600 11px/20px var(--f-mono);text-align:center;padding:0;pointer-events:auto;cursor:pointer;transition:opacity .2s}
.pin.on{background:var(--hot);color:var(--panel);transform-origin:center}
.pin.hide{opacity:0;pointer-events:none}
.v3d-hint{position:absolute;left:10px;top:8px;right:10px;font-family:var(--f-mono);font-size:.7rem;color:var(--ink-3);pointer-events:none}
.v3d-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);background:var(--panel)}
.v3d-range{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:.76rem;flex:1 1 16rem;min-width:0}
.v3d-range input{flex:1;min-width:0;accent-color:var(--acc)}
.v3d-range output{white-space:nowrap;color:var(--acc)}
.v3d-legend{margin:0;padding:6px 12px 12px;list-style:none;display:grid;gap:2px;border-top:1px solid var(--line-2)}
.v3d-legend li button{display:grid;grid-template-columns:1.6rem 1fr;gap:8px;width:100%;text-align:left;background:none;border:0;padding:6px 4px;border-radius:6px;font:inherit;font-size:.88rem;color:var(--ink);cursor:pointer}
.v3d-legend li button span:first-child{font-family:var(--f-mono);font-weight:600;color:var(--acc)}
.v3d-legend li button.on{background:var(--hot-2)}
.v3d-legend li button.on span:first-child{color:var(--hot)}
.v3d-fallback{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:var(--ink-2);font-size:.9rem}
/* Sans JavaScript, la scène de la pièce reste vide : elle le dit, comme .v3d-fallback. */
html:not(.js) .v3d-stage:empty::before{content:"La pièce en 3D a besoin de JavaScript.";position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:var(--ink-2);font-size:.9rem}
.v3d > figcaption{padding:0 12px 12px;margin:0}

/* Blocs repliables : <details>, les pas de dépannage (details.q) et les blocs des fiches « comprendre » (details.bloc) */
details{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin:.75rem 0}
details > summary{display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px 14px;font-weight:600;list-style:none}
details > summary::-webkit-details-marker{display:none}
details > summary::after{content:"›";flex:none;margin-left:auto;font-family:var(--f-mono);font-weight:400;font-size:1rem;line-height:1;color:var(--ink-3);transition:transform .15s}
details[open] > summary::after{transform:rotate(90deg)}
details > summary:hover{color:var(--acc)}
details > summary:focus-visible{outline-offset:-2px;border-radius:var(--r)}
details > div{padding:0 14px 12px}
details > div > :last-child{margin-bottom:0}
details.bloc > summary{padding:12px 16px;font-family:var(--f-disp);font-weight:700;font-stretch:88%;font-size:1.15rem;line-height:1.2}
details.bloc > .bloc-b{padding:0 16px 14px}
.flow{display:grid;gap:8px;margin:1rem 0 1.4rem}
.flow .q{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:10px 14px}
.flow .q b{display:block;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--acc);margin-bottom:.15rem}
.flow > details.q{margin:0;padding:0;background:var(--bg)}
details.q > summary{font-family:var(--f-mono);font-size:.74rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--acc)}
.flow .arrow{font-family:var(--f-mono);font-size:.78rem;color:var(--ink-3);padding-left:14px}

/* Atelier : en-tête, barre des étapes, deux colonnes, précédent et suivant */
article.atelier{display:flex;flex-direction:column;gap:20px;min-width:0}
.atelier-tete{display:flex;flex-direction:column;gap:12px}
.atelier-tete > *{margin:0}
.atelier-num{font-family:var(--f-mono);font-size:.8rem;color:var(--acc)}
.de-vers{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.92rem}
.de-vers .k{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.de-vers .v + .k::before{content:"→";margin-right:8px;font-family:var(--f-mono);color:var(--ink-2)}
.de-vers .v{padding:3px 10px;border-radius:6px;background:var(--panel);border:1px solid var(--line)}
.de-vers .v:last-child{background:var(--hot-2);border-color:var(--hot);color:var(--hot);font-weight:600}
.etapes-barre{display:none;flex-wrap:wrap;gap:8px;margin:1.4rem 0 .6rem}
.js .etapes-barre{display:flex}
.etapes-barre .btn,.pap-nav .btn,.pap-haut .btn{padding:7px 14px;font-size:.78rem;background:var(--panel)}
.etapes-barre .btn.pri,.pap-nav .btn.pri{background:var(--acc)}
.atelier-cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,.9fr);gap:28px;align-items:start}
.atelier-cols.une-colonne{grid-template-columns:minmax(0,1fr)}
.une-colonne .atelier-gauche{max-width:54rem}
.atelier-gauche{min-width:0}
.atelier-gauche > :first-child{margin-top:0}
.atelier-gauche > :last-child{margin-bottom:0}
.atelier-gauche > h4{margin-top:1.6rem}
/* La colonne de droite reste à l'écran pendant que tu lis les étapes ; plus haute que l'écran, elle défile seule. */
.atelier-droite{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h) + 16px);max-height:calc(100vh - var(--top-h) - 32px);overflow-y:auto;scrollbar-width:thin;display:flex;flex-direction:column;gap:14px;min-width:0;padding:2px}
.atelier-droite > *{margin:0}
.atelier-droite > h4{margin:6px 0 -6px}
.atelier-droite > .a-dem,.atelier-droite > .couples-atelier,.atelier-droite > .kit{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.a-dem p{margin:0}
.kit ul.check{border:0;border-radius:0;background:none;margin:0}
.kit ul.check label{padding:8px 0}
.couples-atelier ul{list-style:none;margin:0;padding:0}
.couples-atelier li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;padding:7px 0;border-top:1px solid var(--line-2);font-size:.88rem}
.couples-atelier li:first-child{border-top:0;padding-top:2px}
.ca-etape{flex:1 1 12rem;min-width:0;color:var(--ink-2)}
.atelier-droite > ul.media{gap:6px;margin:0}
.atelier-droite > p.a-video{font-size:.9rem;color:var(--ink-2)}
/* Planche et pièce 3D : un onglet par figure quand le module commun tourne, les deux à la suite sinon */
.figures{display:flex;flex-direction:column;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.figures > figure{margin:0}
.onglets{display:flex;flex-wrap:wrap;gap:4px}
.precsuiv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.precsuiv a{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);text-decoration:none;color:var(--ink)}
.precsuiv a:hover{border-color:var(--acc)}
.precsuiv a.suiv{grid-column:2;text-align:right}
.precsuiv .label{color:var(--acc)}
.precsuiv .prec .label::before{content:"← "}
.precsuiv .suiv .label::after{content:" →"}

/* Catégorie : en-tête du chapitre, ordre du jour J, filtres, cartes des ateliers, couples sur le côté */
.categorie{display:flex;flex-direction:column;gap:22px}
.categorie-tete{display:flex;flex-direction:column;gap:8px;max-width:72ch}
.categorie-tete > *,.ch-head > *{margin:0}
.ch-head{display:flex;flex-direction:column;gap:10px}
.categorie-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,340px);gap:24px;align-items:start}
.categorie-gauche{display:flex;flex-direction:column;gap:16px;min-width:0}
.categorie-gauche > .note{margin:0}
.filtres{display:none;flex-wrap:wrap;gap:6px}
.js .filtres{display:flex}
.filtres button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-family:var(--f-mono);font-size:.76rem;cursor:pointer;color:var(--ink-2)}
.filtres button:hover{border-color:var(--acc)}
.filtres button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cartes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:14px}
.cartes-vide{margin:0}
a.carte{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);text-decoration:none;color:var(--ink);min-width:0}
a.carte:hover{border-color:var(--acc)}
.carte-h{display:flex;align-items:center;gap:8px}
.carte-h .num{font-family:var(--f-disp);font-weight:800;font-stretch:75%;font-size:1.6rem;line-height:1;color:var(--acc)}
.carte-h .pill{margin-left:auto}
.carte .zone{font-family:var(--f-mono);font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
dl.faits{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;font-size:.84rem;line-height:1.45;margin:0}
dl.faits dt{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);padding-top:2px}
dl.faits dd{margin:0;color:var(--ink-2);min-width:0;font-variant-numeric:tabular-nums}
dl.faits .nm{margin-right:2px}
/* Les couples de la catégorie : un tableau compact, ligne par ligne, la source dessous */
.categorie-cote{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.categorie-cote h2{font-family:var(--f-mono);font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-stretch:normal}
.categorie-cote .tbl{margin:0;border:0;border-radius:0;background:none;overflow:visible}
.categorie-cote .tbl table{min-width:0;font-size:.86rem}
.categorie-cote .tbl thead{display:none}
.categorie-cote .tbl.stack tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 0;border:0;border-top:1px solid var(--line-2)}
.categorie-cote .tbl.stack tr:first-child{border-top:0}
.categorie-cote .tbl.stack td{display:block;position:static;padding:0;border:0;min-height:0}
.categorie-cote .tbl.stack td::before{content:none}
.categorie-cote .tbl.stack td:nth-child(2){text-align:right}
.categorie-cote .tbl.stack td:nth-child(3){grid-column:1 / -1;font-size:.8rem;color:var(--ink-3)}

/* Catégorie à venir */
.a-venir{max-width:72ch;background:var(--panel);border:1px dashed var(--line);border-radius:var(--r);padding:14px 16px}
.a-venir h2{font-family:var(--f-mono);font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-stretch:normal;margin-bottom:8px}
.prevu{margin:0;display:flex;flex-direction:column;gap:6px}

/* Références */
section.composants,section.couples-cat{display:flex;flex-direction:column;gap:10px;min-width:0}
section.composants > *,section.couples-cat > *{margin:0}
section.couples-cat{max-width:64rem}
.origine{color:var(--ink-2)}
ul.outils{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
ul.outils > li{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);min-width:0}
.outil{font-weight:500;line-height:1.4}
.o-ateliers{display:flex;flex-wrap:wrap;gap:6px}
.o-ateliers a{font-size:.78rem;line-height:1.5;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--ink-2)}
.o-ateliers a:hover{border-color:var(--acc);color:var(--ink)}
.o-ateliers .num{font-family:var(--f-mono);font-size:.72rem;color:var(--acc)}
/* Ce qui est approché (rempli par le module des références) : une boîte par pièce, sur deux colonnes quand la place le permet */
#approche-page{columns:2 26rem;column-gap:16px}
#approche-page .appr{break-inside:avoid;margin:0 0 16px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
#approche-page .appr h2{font-size:1.25rem;margin:0 0 .3rem}
#approche-page .appr h3{font-family:var(--f-mono);font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-stretch:normal;margin:.9rem 0 .3rem}
/* Sources (rempli par le module des références) : un groupe par type de document */
.sources-type{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.sources-type h2 .cnt{font-family:var(--f-mono);font-size:.7rem;font-weight:500;vertical-align:middle;border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--ink-2);margin-left:2px}
.sources-liste{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:10px}
.sources-liste li{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);min-width:0}
.sources-liste a{line-height:1.4;overflow-wrap:anywhere}
.sources-pieces{font-size:.82rem;color:var(--ink-2)}

/* Mode pas à pas (module commun du site) : une étape à la fois, en très gros, pour lire de loin les mains dans le vélo */
.pas-a-pas{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;gap:12px;padding-block:max(18px,env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-bottom,0px));padding-left:max(clamp(16px,4vw,64px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,4vw,64px),env(safe-area-inset-right,0px))}
html.pap-ouvert{overflow:hidden}
.pap-haut{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.pap-haut .label{color:var(--ink-2)}
.pap-barre{flex:1 1 8rem;height:6px;border-radius:999px;background:var(--line-2);overflow:hidden}
.pap-barre i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.pap-pos{font-family:var(--f-mono);font-size:.82rem;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.pap-corps{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.pap-contenu{margin-block:auto;width:100%;max-width:62rem;margin-inline:auto;display:flex;flex-direction:column;gap:18px;padding-block:12px}
.pap-n{font-family:var(--f-disp);font-weight:800;font-stretch:72%;font-size:clamp(4rem,10vw,8rem);line-height:.9;color:var(--acc);font-variant-numeric:tabular-nums}
.pap-contenu h2{font-size:clamp(1.8rem,3.6vw,3rem);font-stretch:76%}
.pap-texte{font-size:clamp(1.08rem,1.6vw,1.35rem);line-height:1.55;color:var(--ink-2);max-width:60ch}
.pap-texte > :last-child{margin-bottom:0}
.pap-texte a.src{font-size:.7em}
.pap-nav{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
.pap-nav .btn{padding:12px 22px;font-size:.9rem}

/* Mon vélo, d'après la maquette du 21 octobre : l'en-tête, la scène à gauche et « Où intervenir » à droite (une seule
   colonne sous 1100 px), puis les pièces à remplacer, l'introduction et toutes les catégories. La scène et le schéma
   2D viennent de la maquette du 20 octobre. */
.accueil-grille{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(300px,1fr);gap:22px;align-items:start;min-width:0}
.accueil-bloc,.ou-intervenir{display:flex;flex-direction:column;gap:10px;min-width:0}
.accueil-bloc > h2.label,.ou-intervenir > h2.label{color:var(--ink-nav)}
/* « Où intervenir » : une carte par zone, son numéro comme la pastille du vélo, plein quand la zone est choisie */
.ou-intervenir{gap:12px}
.zone-carte{display:flex;flex-direction:column;gap:6px;padding:12px 14px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);min-width:0;transition:border-color .15s,box-shadow .15s}
.zone-carte[aria-current="true"]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.zone-h{display:flex;align-items:center;gap:10px;min-width:0}
.zone-n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--acc);background:var(--panel);color:var(--acc);font-family:var(--f-mono);font-size:.78rem;font-weight:600;line-height:1}
.zone-carte[aria-current="true"] .zone-n{background:var(--acc);color:var(--on-acc)}
.zone-btn{flex:1 1 auto;min-width:0;text-align:left;background:none;border:0;border-radius:6px;padding:2px 0;font-family:var(--f-disp);font-weight:700;font-stretch:88%;font-size:1.15rem;line-height:1.2;color:var(--ink)}
.js .zone-btn{cursor:pointer}
.js .zone-btn:hover{color:var(--acc)}
.zone-carte ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.zone-carte li a{display:flex;align-items:baseline;gap:8px;margin:0 -6px;padding:5px 6px;border-radius:6px;text-decoration:none;color:var(--ink);line-height:1.35}
.zone-carte li a:hover{background:var(--acc-2)}
.zone-carte li .num{flex:none;min-width:2.2em;font-family:var(--f-mono);font-size:.76rem;color:var(--acc)}
.zone-carte li .t{min-width:0}
.zone-carte li .ty{flex:none;margin-left:auto;font-family:var(--f-mono);font-size:.66rem;color:var(--ink-2)}
.zone-carte > p{margin:0;font-size:.88rem}
/* « D’origine, puis à monter » : une carte par pièce à monter, avec son atelier */
ul.a-remplacer{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}
ul.a-remplacer > li{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);min-width:0}
.a-remplacer .vers{font-weight:600;line-height:1.35}
.a-remplacer .de{font-size:.86rem;color:var(--ink-2)}
.a-remplacer .go{align-self:flex-start;margin-top:6px;font-size:.88rem;line-height:1.35;text-decoration:none}
.a-remplacer .go:hover{text-decoration:underline}
.a-remplacer .go .num{font-family:var(--f-mono);font-size:.76rem;margin-right:2px}
/* « Toutes les catégories » : les catégories à venir en pointillés, comme dans le menu */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
a.cat{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);text-decoration:none;color:var(--ink);min-width:0}
a.cat:hover{border-color:var(--acc)}
a.cat.soon{background:transparent;border-style:dashed;color:var(--ink-2)}
a.cat .label{color:var(--acc)}
a.cat.soon .label{color:var(--ink-nav)}
a.cat h3{font-size:1.25rem}
a.cat p{margin:0;font-size:.86rem;color:var(--ink-2)}
/* L'introduction : caractéristiques, jour de la livraison, légende et règle des sources */
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin:0;overflow:hidden}
.specs div{padding:10px 14px;border-bottom:1px solid var(--line-2);min-width:0}
.specs dt{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.specs dd{margin:0;font-size:.93rem}
.specs + .eyebrow{margin-top:1.8rem}
.plan{list-style:none;padding:0;margin:1.2rem 0 0;display:grid;gap:8px;counter-reset:plan}
.plan li{counter-increment:plan;display:grid;grid-template-columns:2.6rem 1fr auto;gap:10px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.plan li::before{content:counter(plan);font-family:var(--f-disp);font-weight:800;font-stretch:75%;font-size:1.7rem;color:var(--acc);line-height:1}
.plan b{display:block;font-weight:600}
.plan span{font-size:.86rem;color:var(--ink-2)}
.plan a,.plan li > span.muted{font-family:var(--f-mono);font-size:.75rem;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:1rem 0 0;font-size:.85rem;color:var(--ink-2)}
.intro{padding-bottom:8px}
.scene{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.scene figcaption{margin:0;font-size:.84rem;color:var(--ink-3)}
.scene .modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--plate);border:1px solid var(--line);border-radius:12px;padding:4px}
.scene .modes button{font:inherit;color:var(--ink);border:0;background:none;border-radius:9px;padding:9px 6px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
