<title>Atelier Grizl</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Guide d'atelier pour monter, régler et réparer soi-même le Canyon Grizl CF 7.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Mise en page : manuel d'atelier de poche. Une colonne de lecture, planches techniques sur fond « calque », barre de chapitres collante. */
:root{
  --bg:#EDF0EF; --panel:#F9FAFA; --plate:#E3E8E9;
  --ink:#16202A; --ink-2:#465462; --ink-3:#6F7D89;
  --line:#C6CFD4; --line-2:#DAE1E4;
  --acc:#56479A; --acc-2:#E9E5F6; --on-acc:#FFFFFF;
  --hot:#9E4C06; --hot-2:#FAE8D6;
  --ok:#2B724A; --ok-2:#DFF0E5;
  --stop:#AE2A20; --stop-2:#F7E0DC;
  --studio-hi:#FDFDFD; --studio-lo:#D5DADD; --shadow:rgba(22,32,42,.18);
  --f-disp:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --col:46rem; --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151A; --panel:#161D23; --plate:#19222A;
    --ink:#E3E9ED; --ink-2:#A6B3BD; --ink-3:#7A8893;
    --line:#2D3842; --line-2:#222B33;
    --acc:#B1A5F0; --acc-2:#272242; --on-acc:#16112B;
    --hot:#F2A766; --hot-2:#3A2816;
    --ok:#78CB9E; --ok-2:#16321F;
    --stop:#F48B81; --stop-2:#3E1D1A;
    --studio-hi:#3A424A; --studio-lo:#14191E; --shadow:rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151A; --panel:#161D23; --plate:#19222A;
  --ink:#E3E9ED; --ink-2:#A6B3BD; --ink-3:#7A8893;
  --line:#2D3842; --line-2:#222B33;
  --acc:#B1A5F0; --acc-2:#272242; --on-acc:#16112B;
  --hot:#F2A766; --hot-2:#3A2816;
  --ok:#78CB9E; --ok-2:#16321F;
  --stop:#F48B81; --stop-2:#3E1D1A;
  --studio-hi:#3A424A; --studio-lo:#14191E; --shadow:rgba(0,0,0,.45);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
input,select,textarea{font:inherit;font-size:16px}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:var(--col);margin-inline:auto}
a{color:var(--acc);text-underline-offset:2px}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
p{margin:0 0 .75em}
ul,ol{margin:0 0 1em;padding-left:1.25em}
strong{font-weight:600}
h1,h2,h3,h4{font-family:var(--f-disp);text-wrap:balance;margin:0;line-height:1.08}
h1{font-size:clamp(2.6rem,9vw,4.4rem);font-weight:800;font-stretch:72%;letter-spacing:-.01em}
h2{font-size:clamp(1.9rem,6vw,2.7rem);font-weight:800;font-stretch:76%;letter-spacing:-.005em}
h3{font-size:1.32rem;font-weight:700;font-stretch:88%;margin:2.2rem 0 .6rem}
h4{font-family:var(--f-mono);font-size:.74rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:0 0 .5rem}
.eyebrow,.ch-num{font-family:var(--f-mono);font-size:.75rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin:0 0 .55rem}
.lead,.ch-lead{font-size:1.08rem;color:var(--ink-2);max-width:40rem}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}

/* En-tête */
.masthead{padding-block:calc(28px + env(safe-area-inset-top,0px)) 8px}
.masthead h1{margin:.1rem 0 .7rem}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin:1.4rem 0 0;overflow:hidden}
.specs div{padding:10px 14px;border-bottom:1px solid var(--line-2);min-width:0}
.specs dt{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.specs dd{margin:0;font-size:.93rem}
.specs + .eyebrow{margin-top:1.8rem}
.plan{list-style:none;padding:0;margin:1.2rem 0 0;display:grid;gap:8px;counter-reset:plan}
.plan li{counter-increment:plan;display:grid;grid-template-columns:2.6rem 1fr auto;gap:10px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.plan li::before{content:counter(plan);font-family:var(--f-disp);font-weight:800;font-stretch:75%;font-size:1.7rem;color:var(--acc);line-height:1}
.plan b{display:block;font-weight:600}
.plan span{font-size:.86rem;color:var(--ink-2)}
.plan a{font-family:var(--f-mono);font-size:.75rem;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:1rem 0 0;font-size:.85rem;color:var(--ink-2)}

/* Barre de chapitres */
.chapnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin:1.6rem calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.chapnav ul{list-style:none;margin:0 auto;padding:8px 0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:var(--col)}
.chapnav ul::-webkit-scrollbar{display:none}
.chapnav a{display:block;white-space:nowrap;text-decoration:none;font-family:var(--f-mono);font-size:.78rem;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:var(--panel)}
.chapnav a[aria-current="true"]{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}

/* Chapitres */
.chapter{padding-block:3rem 1rem;border-bottom:1px solid var(--line)}
.ch-head{margin-bottom:1.4rem}
.ch-head h2{margin-bottom:.6rem}
.sub{margin-top:1rem}
.sub > h3:first-child{margin-top:2.4rem}

/* Encadré « Il te faut » */
.kit{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:12px 14px;margin:1rem 0}
.chips{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px}
.chips li{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.86rem;background:var(--bg)}

/* Étapes numérotées */
ol.steps{list-style:none;padding:0;margin:1rem 0 1.4rem;counter-reset:st}
ol.steps > li{counter-increment:st;display:grid;grid-template-columns:2.3rem 1fr;gap:4px 10px;padding:12px 0;border-top:1px solid var(--line-2)}
ol.steps > li::before{content:counter(st);font-family:var(--f-disp);font-weight:800;font-stretch:75%;font-size:1.45rem;line-height:1.1;color:var(--acc)}
ol.steps > li > *{grid-column:2;min-width:0}
ol.steps > li > :last-child{margin-bottom:0}
.st-t{font-weight:600;margin-bottom:.2rem}

/* Valeurs et marqueurs */
.nm{font-family:var(--f-mono);font-weight:600;font-size:.86em;color:var(--hot);background:var(--hot-2);padding:1px 6px;border-radius:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.verif{font-family:var(--f-mono);font-size:.78em;color:var(--acc);border:1px dashed var(--acc);border-radius:4px;padding:0 5px;white-space:nowrap}
a.src{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-3);text-decoration-style:dotted}
a.src::before{content:"↗ "}
.ref{font-family:var(--f-mono);font-size:.88em}

/* Encadrés */
.note{border-left:3px solid var(--acc);background:var(--acc-2);padding:10px 14px;border-radius:0 8px 8px 0;margin:1rem 0}
.note > :last-child{margin-bottom:0}
.note-t{font-family:var(--f-mono);font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.25rem}
.note.warn{border-color:var(--stop);background:var(--stop-2)}
.note.warn .note-t{color:var(--stop)}
.note.info .note-t{color:var(--acc)}
.note.tip{border-color:var(--ok);background:var(--ok-2)}
.note.tip .note-t{color:var(--ok)}
.note.prop{border:1px dashed var(--ink-3);border-left:3px dashed var(--ink-3);background:var(--panel)}
.note.prop .note-t{color:var(--ink-2)}

/* Planches 2D */
figure{margin:1.4rem 0}
.plate-art{background:var(--plate);border:1px solid var(--line);border-radius:var(--r);padding:10px;overflow-x:auto}
.plate-art svg{display:block;width:100%;height:auto;min-width:300px}
figcaption{font-size:.85rem;color:var(--ink-2);margin-top:.5rem}
.pl-n{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--acc);margin-right:.4em}
/* Classes de dessin SVG (aucune couleur en dur) */
svg .ln{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg .ln2{fill:none;stroke:var(--ink);stroke-width:1;stroke-linecap:round;stroke-linejoin:round}
svg .ln3{fill:none;stroke:var(--ink-2);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
svg .dim{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:4 3}
svg .fl{fill:var(--panel);stroke:var(--ink);stroke-width:1.4;stroke-linejoin:round}
svg .fl2{fill:var(--line-2);stroke:var(--ink);stroke-width:1.2;stroke-linejoin:round}
svg .fl3{fill:var(--line);stroke:var(--ink);stroke-width:1.2;stroke-linejoin:round}
svg .ink{fill:var(--ink)}
svg .ac{fill:none;stroke:var(--acc);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg .acf{fill:var(--acc)}
svg .ac2f{fill:var(--acc-2);stroke:var(--acc);stroke-width:1.4}
svg .ht{fill:none;stroke:var(--hot);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg .htf{fill:var(--hot)}
svg .ht2f{fill:var(--hot-2);stroke:var(--hot);stroke-width:1.4}
svg .okl{fill:none;stroke:var(--ok);stroke-width:2;stroke-linecap:round}
svg .okf{fill:var(--ok)}
svg .stl{fill:none;stroke:var(--stop);stroke-width:2;stroke-linecap:round}
svg .stf{fill:var(--stop)}
svg .t{fill:var(--ink);font-family:var(--f-mono);font-size:11px}
svg .t2{fill:var(--ink-2);font-family:var(--f-mono);font-size:10px}
svg .tb{font-weight:600}
svg .ta{fill:var(--acc)}
svg .th{fill:var(--hot)}
svg .to{fill:var(--ok)}
svg .ts{fill:var(--stop)}
svg .tc{text-anchor:middle}
svg .te{text-anchor:end}
svg .td{font-family:var(--f-disp);font-weight:700}
svg .badge{fill:var(--acc)}
svg .badge-t{fill:var(--on-acc);font-family:var(--f-mono);font-size:10px;font-weight:600;text-anchor:middle}
svg .mk{fill:var(--ink)}
svg .mka{fill:var(--acc)}
svg .mkh{fill:var(--hot)}

/* Tableaux */
.tbl{overflow-x:auto;margin:1rem 0 1.4rem;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.tbl table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:30rem}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:8px 12px;border-bottom:1px solid var(--line-2)}
.tbl th{font-family:var(--f-mono);font-size:.7rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);background:var(--bg)}
.tbl tr:last-child td{border-bottom:0}
.tbl td{font-variant-numeric:tabular-nums}
.tbl td.n{white-space:nowrap}
/* Tableau qui se replie en fiches sur téléphone : <div class="tbl stack"> et data-label="Titre de colonne" sur chaque <td> */
@media (max-width:560px){
  .tbl.stack table{min-width:0}
  .tbl.stack thead{display:none}
  .tbl.stack tr{display:block;padding:8px 0;border-bottom:1px solid var(--line-2)}
  .tbl.stack tr:last-child{border-bottom:0}
  .tbl.stack td{display:block;position:relative;border:0;padding:3px 12px 3px calc(12px + 7.2rem);min-height:1.6em}
  .tbl.stack td::before{content:attr(data-label);position:absolute;left:12px;top:5px;width:6.8rem;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
  .tbl.stack td.n{white-space:normal}
  .tbl.stack th[colspan]{display:block}
}

/* Vidéos et manuels */
ul.media{list-style:none;padding:0;margin:1rem 0 1.4rem;display:grid;gap:8px}
ul.media a{display:grid;gap:2px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);text-decoration:none;color:var(--ink)}
ul.media a:hover{border-color:var(--acc)}
.m-kind{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--acc)}
.m-title{font-weight:500}
.m-note{font-size:.84rem;color:var(--ink-2)}

/* Listes à cocher */
ul.check{list-style:none;padding:0;margin:1rem 0 1.4rem;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
ul.check li{border-bottom:1px solid var(--line-2)}
ul.check li:last-child{border-bottom:0}
ul.check label{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;cursor:pointer}
ul.check input{accent-color:var(--acc);width:1.15rem;height:1.15rem;margin:.2rem 0 0;flex:none}
ul.check input:checked + span{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-3)}
.check-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:1.2rem}
.check-head h4{margin:0}
.btn-reset{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-2);background:none;border:0;text-decoration:underline;cursor:pointer;padding:4px}

/* Pièces en 3D */
.v3d{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.v3d-stage{position:relative;width:100%;aspect-ratio:4/3;max-height:72vh;background:radial-gradient(120% 90% at 50% 35%,var(--panel),var(--plate))}
.v3d-stage canvas{display:block;width:100%;height:100%;touch-action:pan-y}
.v3d-stage.free canvas{touch-action:none}
.v3d-pins{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pin{position:absolute;left:0;top:0;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;border:2px solid var(--panel);background:var(--acc);color:var(--on-acc);font:600 11px/20px var(--f-mono);text-align:center;padding:0;pointer-events:auto;cursor:pointer;transition:opacity .2s}
.pin.on{background:var(--hot);color:var(--panel);transform-origin:center}
.pin.hide{opacity:0;pointer-events:none}
.v3d-hint{position:absolute;left:10px;top:8px;right:10px;font-family:var(--f-mono);font-size:.7rem;color:var(--ink-3);pointer-events:none}
.v3d-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);background:var(--panel)}
.btn{font-family:var(--f-mono);font-size:.76rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.btn[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.v3d-range{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:.76rem;flex:1 1 16rem;min-width:0}
.v3d-range input{flex:1;min-width:0;accent-color:var(--acc)}
.v3d-range output{white-space:nowrap;color:var(--acc)}
.v3d-legend{margin:0;padding:6px 12px 12px;list-style:none;display:grid;gap:2px;border-top:1px solid var(--line-2)}
.v3d-legend li button{display:grid;grid-template-columns:1.6rem 1fr;gap:8px;width:100%;text-align:left;background:none;border:0;padding:6px 4px;border-radius:6px;font:inherit;font-size:.88rem;color:var(--ink);cursor:pointer}
.v3d-legend li button span:first-child{font-family:var(--f-mono);font-weight:600;color:var(--acc)}
.v3d-legend li button.on{background:var(--hot-2)}
.v3d-legend li button.on span:first-child{color:var(--hot)}
.v3d-fallback{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:var(--ink-2);font-size:.9rem}
.v3d > figcaption{padding:0 12px 12px;margin:0}

/* Pas de dépannage */
.flow{display:grid;gap:8px;margin:1rem 0 1.4rem}
.flow .q{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:10px 14px}
.flow .q b{display:block;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--acc);margin-bottom:.15rem}
.flow .arrow{font-family:var(--f-mono);font-size:.78rem;color:var(--ink-3);padding-left:14px}
details{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin:.6rem 0}
details > summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style-position:inside}
details > div{padding:0 14px 12px}

/* Accueil : le vélo en 3D, ses zones d'atelier et la fiche ouverte. Repris de la maquette du 20 octobre. */
.intro{padding-bottom:8px}
.accueil{display:flex;flex-direction:column;gap:14px;margin:1.2rem 0 1.6rem;min-width:0}
.scene{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.scene figcaption{margin:0;font-size:.84rem;color:var(--ink-3)}
.scene .modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--plate);border:1px solid var(--line);border-radius:12px;padding:4px}
.scene .modes button{font:inherit;color:var(--ink);border:0;background:none;border-radius:9px;padding:9px 6px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.scene .modes b{font-family:var(--f-disp);font-weight:750;font-stretch:85%;font-size:1rem;line-height:1.1;text-align:center}
.scene .modes small{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.scene .modes button[aria-selected="true"]{background:var(--panel);box-shadow:0 1px 3px var(--shadow)}
.scene .modes button[aria-selected="true"] small{color:var(--acc)}
.scene .modes button:disabled{opacity:.45;cursor:not-allowed}
/* Ni 3D ni schéma 2D : app.js, ou le garde-fou de 99-foot.html, réduit la scène à son message. */
.scene.sans-rendu .modes,.scene.sans-rendu .stage,.scene.sans-rendu figcaption{display:none}
.scene-alerte{margin:0;font-family:var(--f-mono);font-size:.78rem;color:var(--hot);background:var(--hot-2);border-radius:8px;padding:8px 10px}
.scene .stage{position:relative;width:100%;aspect-ratio:4/3.3;max-height:74vh;background:var(--plate);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.scene .stage.studio{background:radial-gradient(120% 95% at 50% 36%,var(--studio-hi) 0%,var(--studio-lo) 100%)}
.scene .stage svg,.scene .stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene .stage canvas{touch-action:none}
/* L'aide sur un panneau, pour se lire sans recouvrir le dessin ni la 3D. Sans color-mix, le panneau est plein. */
.scene .hint{position:absolute;left:10px;top:8px;width:fit-content;max-width:calc(100% - 20px);margin:0;padding:4px 9px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel);background:color-mix(in srgb,var(--panel) 88%,transparent);font-family:var(--f-mono);font-size:.7rem;line-height:1.4;color:var(--ink-2);pointer-events:none}
.scene .status{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font-family:var(--f-mono);font-size:.8rem;color:var(--ink-2);pointer-events:none}
.scene .stage-btn{position:absolute;bottom:10px;font-family:var(--f-mono);font-size:.72rem;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer}
#approche{left:10px}
#vue-ensemble{right:10px}
.scene .key{position:absolute;left:12px;bottom:48px;display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--f-mono);font-size:.68rem;color:var(--ink-2);pointer-events:none;max-width:62%}
.scene .key span{display:inline-flex;align-items:center;gap:5px}
.scene .key i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* Couleurs de famille du mode simple, celles de creerMateriaux (src/scene/materiaux.js) */
.scene .key .k-trans{background:#6b5bc2}
.scene .key .k-freins{background:#d9822b}
.scene .key .k-cadre{background:#a3aeb8}
/* Pastilles des zones, posées en pixels sur l'image */
#pins{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.zpin{position:absolute;left:0;top:0;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:2px solid var(--acc);background:var(--panel);color:var(--acc);font-family:var(--f-mono);font-size:.8rem;font-weight:600;display:grid;place-items:center;cursor:pointer;pointer-events:auto;box-shadow:0 1px 5px var(--shadow);padding:0}
.zpin::before{content:"";position:absolute;inset:-7px;border-radius:50%}
.zpin.on{background:var(--acc);color:var(--on-acc)}
.zpin.on::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--acc);opacity:.5;animation:ping 1.8s ease-out infinite}
@keyframes ping{from{transform:scale(.8);opacity:.6}to{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion: reduce){.zpin.on::after{animation:none}}
/* Puces des zones, sous la scène */
.zones{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;min-width:0}
.zones::-webkit-scrollbar{display:none}
.zones button{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px 6px 6px;cursor:pointer;font:inherit;font-size:.88rem;color:var(--ink);white-space:nowrap}
.zones button span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:.72rem;font-weight:600;color:var(--acc);border:1.5px solid var(--acc)}
.zones button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-2)}
.zones button[aria-pressed="true"] span{background:var(--acc);color:var(--on-acc)}
/* Fiche de la zone ouverte : l'atelier y est déplacé depuis son chapitre */
.fiche{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.fiche > *{margin:0}
.fiche-tete{display:flex;gap:12px;align-items:flex-start}
.fiche-tete .num{flex:0 0 auto;font-family:var(--f-disp);font-weight:800;font-stretch:70%;font-size:2.4rem;line-height:.9;color:var(--acc)}
.fiche-tete .eyebrow{margin-bottom:.25rem}
.fiche-tete h2{font-size:1.45rem;font-stretch:85%}
.fiche-pieces{margin-top:.35rem;font-size:.86rem;line-height:1.4;color:var(--ink-2)}
.fiche-pieces p{margin:0}
.swap{display:inline-grid;grid-template-columns:repeat(2,minmax(0,auto));gap:3px;background:var(--plate);border:1px solid var(--line);border-radius:999px;padding:3px;align-self:flex-start;max-width:100%}
.swap button{font:inherit;font-size:.84rem;color:var(--ink);border:0;background:none;border-radius:999px;padding:6px 12px;cursor:pointer;min-width:0}
.swap button[aria-pressed="true"]{background:var(--acc);color:var(--on-acc)}
.fiche-ateliers{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.fiche-ateliers button{font:inherit;font-size:.84rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;text-align:left}
.fiche-ateliers button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.fiche-atelier{min-width:0}
.fiche-atelier > .atelier{margin:0}
.fiche-atelier > .atelier > h3:first-child{margin-top:0}
.fiche .fiche-approche{background:var(--bg)}
.fiche-approche > summary{font-weight:500;font-size:.9rem}
.fiche-approche p{margin:.6rem 0 .2rem;font-size:.88rem;font-weight:600}
.fiche-approche ul{margin:0;font-size:.88rem;color:var(--ink-2)}
@media (max-width:420px){.fiche{padding:14px}}
/* Liste « Ce qui est approché » */
.approche-liste{width:min(40rem,calc(100vw - 32px));max-height:min(85vh,52rem);padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--ink);overflow:auto}
.approche-liste::backdrop{background:rgba(0,0,0,.45)}
.dlg-tete{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.dlg-tete h2{font-size:1.45rem;font-stretch:85%}
.dlg-tete form{margin:0}
.approche-liste > p{margin:12px 16px}
#approche-contenu{padding:0 16px 8px}
.appr{padding:12px 0;border-top:1px solid var(--line-2)}
.appr h3{margin:0 0 .4rem;font-size:1.1rem}
.appr h4{margin:.7rem 0 .25rem}
.appr ul{margin:0;font-size:.9rem}
.appr li{margin:.15rem 0;overflow-wrap:anywhere}
/* Schéma 2D : classes posées par src/scene/schema2d.js, reprises de la maquette */
#plan .o{fill:var(--panel);stroke:var(--ink);stroke-width:1.4px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
#plan .n{fill:none;stroke:var(--ink);stroke-width:1.1px;vector-effect:non-scaling-stroke}
#plan .t{fill:none;stroke:var(--ink-3);stroke-width:.7px;vector-effect:non-scaling-stroke}
#plan .k{fill:var(--ink-2);stroke:var(--ink);stroke-width:1px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
#plan .kb{fill:none;stroke:var(--ink-2);stroke-width:24;stroke-linecap:round;stroke-linejoin:round}
#plan .kb2{fill:none;stroke:var(--ink-2);stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
#plan .h{fill:none;stroke:var(--ink-3);stroke-width:4;stroke-dasharray:16 11}
#plan .ch{fill:none;stroke:var(--ink-2);stroke-width:3.4px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
#plan .ch2{fill:none;stroke:var(--plate);stroke-width:1px;vector-effect:non-scaling-stroke}
#plan .ground{stroke:var(--line);stroke-width:1.2px;vector-effect:non-scaling-stroke}
#plan g.on .o{fill:var(--acc-2);stroke:var(--acc)}
#plan g.on .n,#plan g.on .t,#plan g.on .h,#plan g.on .ch{stroke:var(--acc)}
#plan g.on .k{fill:var(--acc);stroke:var(--acc)}
#plan g.on .kb,#plan g.on .kb2{stroke:var(--acc)}
#plan g.on .h{stroke-width:6}

/* Statut des lots */
.lot-badge{display:inline-block;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--hot);border:1px solid var(--hot);border-radius:999px;padding:2px 9px;margin:0 0 .6rem}
.lot-badge.ok{color:var(--ok);border-color:var(--ok)}
.lots{list-style:none;padding:0;margin:.6rem 0 0;display:grid;gap:6px}
.lots li{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;border:1px dashed var(--line);border-radius:var(--r);font-size:.9rem;color:var(--ink-2)}
.lots li span:last-child{font-family:var(--f-mono);font-size:.72rem;white-space:nowrap}
.footer{padding-block:2.4rem calc(3rem + env(safe-area-inset-bottom,0px));font-size:.86rem;color:var(--ink-2)}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
@media (min-width:900px){html{scroll-behavior:smooth}}
</style>
